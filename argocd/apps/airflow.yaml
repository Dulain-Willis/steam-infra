apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airflow
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://airflow.apache.org
      chart: airflow
      targetRevision: 1.22.0
      helm:
        # Base, then the prod overlay, then prod's image -- later files win.
        valueFiles:
          - $values/k8s/airflow/values.yaml
          - $values/k8s/airflow/values-prod.yaml
          - $values/k8s/airflow/values-image-prod.yaml
    - repoURL: https://github.com/Dulain-Willis/steam-infra.git
      targetRevision: spec-112-environments
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: airflow
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
