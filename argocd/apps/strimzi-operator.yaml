apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Dulain-Willis/steam-infra.git
    targetRevision: main
    path: k8s/strimzi-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
  # The Kafka CRD's .status subresource (acceptedNames, conditions,
  # storedVersions) is populated by the API server after creation and never
  # appears in the git manifest -- without this, ArgoCD's diff flags it
  # OutOfSync forever and selfHeal loops re-applying a no-op every
  # reconciliation, never converging.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /status
