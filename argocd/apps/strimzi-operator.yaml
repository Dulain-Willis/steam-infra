apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Dulain-Willis/steam-infra.git
    targetRevision: main
    path: k8s/strimzi-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
  # The Kafka CRD's own .status subresource (acceptedNames, conditions,
  # storedVersions) is populated by the API server after creation and never
  # appears in the git manifest. That alone isn't the real problem, though
  # (every other Strimzi CRD has the same subresource and syncs fine) --
  # confirmed live via a structural diff: the Kafka CR's status *schema*
  # (spec.versions[].schema.openAPIV3Schema.properties.status) is the
  # largest of any Strimzi CRD, and the API server silently prunes at least
  # one empty `properties: {}` node inside it on storage (a known
  # Kubernetes behavior with large CRD schemas). ArgoCD's diff sees that as
  # permanent drift and selfHeal loops re-applying a no-op every
  # reconciliation, never converging. jqPathExpressions (not jsonPointers,
  # which can't glob the versions array) ignores both.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .status
        - .spec.versions[].schema.openAPIV3Schema.properties.status
