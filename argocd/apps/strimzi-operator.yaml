apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: oci://quay.io/strimzi-helm
    chart: strimzi-kafka-operator
    targetRevision: 1.2.0
    helm:
      values: |
        watchNamespaces:
          - kafka
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
