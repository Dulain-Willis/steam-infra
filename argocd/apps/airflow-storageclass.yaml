apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airflow-storageclass
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Dulain-Willis/steam-infra.git
    targetRevision: main
    path: k8s/airflow/storageclass
  destination:
    server: https://kubernetes.default.svc
    namespace: airflow
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
