# Debezium Postgres source connector for all 16 OLTP tables (#44, #10, per
# docs/debezium-postgres-config.md and #29). Applied via kubectl, not
# Terraform (IaC boundary #28). Requires:
#   - Kafka Connect running with the debezium-postgres-connector plugin
#     built in (kafka-connect.yaml, #42) and config.providers=secrets
#     enabled there for the ${secrets:...} refs below
#   - the rds-credentials Secret in the `kafka` namespace
#     (scripts/create-connector-secrets.sh, #43)
#   - RDS logical replication + the connecting user's grants already in
#     place (scripts/check-rds-prereqs.sh, #31) — a plugin.name: pgoutput
#     failure at connector startup almost always means this step was skipped
#
# database.hostname is a placeholder — replace with:
#   cd terraform && tofu output -raw rds_endpoint
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: debezium-postgres-source
  namespace: kafka
  labels:
    strimzi.io/cluster: steam-infra
spec:
  class: io.debezium.connector.postgresql.PostgresConnector
  tasksMax: 1
  config:
    database.hostname: <rds-endpoint>
    database.port: "5432"
    database.dbname: steam
    database.user: "${secrets:kafka/rds-credentials:username}"
    database.password: "${secrets:kafka/rds-credentials:password}"
    plugin.name: pgoutput
    # No persisted offsets between sessions (#27) — every start takes a
    # fresh full snapshot instead of resuming, see docs/debezium-postgres-config.md.
    snapshot.mode: always
    slot.name: debezium_steam
    publication.name: debezium_steam
    publication.autocreate.mode: filtered
    topic.prefix: steam
    schema.include.list: public
    table.include.list: >-
      public.users,public.games,public.game_prices,public.purchases,
      public.ownership_grants,public.gifts,public.key_redemptions,
      public.refunds,public.family_shares,public.wishlist_items,
      public.playtime_sessions,public.reviews,public.price_changes,
      public.concurrent_player_snapshots,public.marketing_campaigns,
      public.client_events
    topic.creation.enable: "true"
    topic.creation.default.replication.factor: 3
    topic.creation.default.partitions: 1
    # Flatten the Debezium envelope so the Snowflake sink can schematize
    # (steam-analytics#9's Staging phase needs typed columns, not two VARIANT
    # blobs — steam-analytics#28, see docs/debezium-postgres-config.md).
    # ExtractNewRecordState (ENRS) unwraps payload.after to the top level and
    # drops payload.before/op/ts_ms — add.fields re-adds the CDC metadata we
    # still need as __-prefixed columns.
    transforms: unwrap
    transforms.unwrap.type: io.debezium.transforms.ExtractNewRecordState
    transforms.unwrap.add.fields: op,source.ts_ms,source.lsn,source.snapshot,source.table
    # A streaming delete has no `after` — without rewrite mode ENRS would
    # emit a same-key null-value tombstone instead of a row, and the
    # Snowflake sink can't schematize a null. rewrite instead emits a real
    # row carrying __deleted=true.
    transforms.unwrap.delete.tombstone.handling.mode: rewrite
    transforms.unwrap.replace.null.with.default: "false"
    # Schematization (on the sink) needs a Connect schema traveling with the
    # message; JsonConverter carries it inline (no Schema Registry service).
    value.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter.schemas.enable: "true"
