# 3-node KRaft Kafka cluster (combined controller+broker, per #32/#41).
# Applied via kubectl, not Terraform (IaC boundary per #28) — Terraform only
# provisions EKS and installs the Strimzi operator (terraform/eks.tf,
# terraform/strimzi.tf). Requires the operator to already be running in the
# `kafka` namespace.
#
# Storage is ephemeral: every session does a full Debezium snapshot
# (snapshot.mode: always, see docs/debezium-postgres-config.md) and the
# cluster is torn down between sessions, so there's nothing worth persisting
# across pod restarts — matches the project's teardown-between-sessions
# cost discipline.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: kafka
  labels:
    strimzi.io/cluster: steam-infra
spec:
  replicas: 3
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: ephemeral
        kraftMetadata: shared
  template:
    pod:
      # Pin brokers to the dedicated On-Demand Kafka node group (terraform/eks.tf)
      # so Spot reclaim of the general system pool never evicts a broker mid-session (#37).
      # This Strimzi version's PodTemplate has no plain nodeSelector field
      # (dropped from the CRD) — nodeAffinity is the only way to target nodes.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: role
                    operator: In
                    values:
                      - kafka
        # Kafka node group has exactly 3 nodes (terraform/eks.tf) — require
        # one broker per node so losing a single node can't take out 2 of 3
        # replicas at once (nodeAffinity alone only picks the right node
        # *pool*, it doesn't spread pods across the pool's nodes).
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  strimzi.io/cluster: steam-infra
                  strimzi.io/kind: Kafka
              topologyKey: kubernetes.io/hostname
      tolerations:
        - key: dedicated
          operator: Equal
          value: kafka
          effect: NoSchedule
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: steam-infra
  namespace: kafka
spec:
  kafka:
    version: 4.3.1
    metadataVersion: 4.3-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
