# Base Helm values for every Airflow release on this cluster. Shared only --
# nothing environment-specific belongs in this file.
#
# A release is assembled from three values files, in this order (later wins):
#
#   values.yaml              this file, shared by every environment
#   values-<env>.yaml        the environment overlay (prod: values-prod.yaml)
#   values-image-<env>.yaml  the image, machine-owned (bumped by a bot commit
#                            from steam-orchestration's build-and-push.yml)
#
# The list lives in each environment's ArgoCD Application (argocd/apps/).
#
# Why `extraEnv` is wholly in the overlay and not split across the two:
# the chart's `env` is schema-validated to {name, value} only, so secretKeyRef
# has to go in `extraEnv`, which is a raw templated *string*. Helm replaces
# strings (and lists) wholesale rather than merging them, so a base `extraEnv`
# plus an overlay `extraEnv` would mean the base's is silently discarded. The
# only safe split is therefore all-or-nothing, and since most of the block is
# environment-specific, all of it lives in the overlay. Everything below is a
# map, which Helm *does* merge key-by-key, so overlays extend it additively.

# dbt ls against Snowflake (cold TLS+auth+full manifest parse) exceeds the
# chart's default 30s dagbag_import_timeout -- DAG never renders, no error
# in dbt itself. Bumped, not a secret/auth problem.
config:
  core:
    dagbag_import_timeout: '120'
  celery:
    worker_concurrency: '2'

# The chart hardcodes this job as a post-install,post-upgrade Helm hook, but
# ArgoCD only runs PostSync hooks once every Sync-phase resource is Healthy --
# and the scheduler/api-server/dag-processor Deployments can never go Healthy
# because their wait-for-airflow-migrations init container blocks on this same
# job (deadlock). PreSync doesn't work either: it runs *before* Sync-phase
# resources, so the job's own ServiceAccount doesn't exist yet
# ("serviceaccount ... not found", retried forever). An explicit
# argocd.argoproj.io/hook annotation takes precedence over the translated
# Helm hook (ArgoCD docs) -- overriding it to Sync makes the job a plain
# Sync-phase resource instead of gated on a phase transition. That alone
# isn't enough, though: ArgoCD also reads the chart's helm.sh/hook-weight
# ("1") as this resource's sync-wave, so it still lands in a later wave than
# the Deployments (wave 0, the default) and ArgoCD won't start that wave
# until wave 0 is Healthy -- same deadlock, one wave later. Pinning
# sync-wave to "0" puts it in the same wave as everything else (including
# its ServiceAccount, also wave 0) instead. The Deployments' init containers
# still crash-loop a few times until the job completes, but that resolves
# itself on their normal backoff -- no deadlock. `airflow db migrate` is
# idempotent, so re-running it every sync is harmless.
migrateDatabaseJob:
  jobAnnotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "0"

# Internal ALB ingress (#107) -- grouped with argocd.yaml's Ingress onto one
# shared ALB via group.name. internal/ip/HTTP-only annotations mirror #106's
# locked-in decisions (no public exposure, no TLS/domain). `scheme` is an
# *exclusive* IngressGroup annotation: every member of the group must agree on
# it or the whole group stops reconciling and no member is updated -- which is
# the reason it lives here rather than in each overlay.
#
# `path` and `alb.ingress.kubernetes.io/group.order` are per-environment and
# set in the overlay: /airflow is a prefix of /airflow-staging, so the two
# rules overlap and the order they are evaluated in decides which one wins.
ingress:
  apiServer:
    enabled: true
    ingressClassName: alb
    pathType: Prefix
    annotations:
      alb.ingress.kubernetes.io/group.name: steam-infra-admin
      alb.ingress.kubernetes.io/scheme: internal
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
