# Staging overlay for the Airflow release. Applied on top of values.yaml; see
# that file's header for how the three values files fit together.
#
# Everything here is environment-specific, and this file is deliberately
# values-prod.yaml with exactly six values changed: SNOWFLAKE_ROLE,
# SNOWFLAKE_DATABASE, DBT_TARGET, AIRFLOW__API__BASE_URL, the ingress path and
# its group.order. `diff values-prod.yaml values-staging.yaml` should show
# those six and nothing else -- everything else is byte-identical on purpose,
# the secretKeyRef blocks included: the secret *names* are namespace-local and
# the same in both namespaces, so only their contents differ
# (bringup/stages/05-cluster.sh creates them per namespace).
#
# The duplication is not a mistake to be factored out into the base: extraEnv
# is one raw string, Helm replaces strings instead of merging them, and a base
# copy would be silently discarded. See values.yaml's header.

# The whole block lives in the overlay rather than being split with the base:
# extraEnv is a raw string and Helm replaces strings instead of merging them,
# so a base copy plus an overlay copy would mean the base's is discarded. See
# values.yaml's header.
extraEnv: |
  - name: SNOWFLAKE_ACCOUNT
    valueFrom:
      secretKeyRef:
        name: snowflake-account
        key: account

  - name: SNOWFLAKE_USER
    valueFrom:
      secretKeyRef:
        name: snowflake-user
        key: user

  - name: SNOWFLAKE_ROLE
    value: TRANSFORMER_STAGING

  - name: SNOWFLAKE_WAREHOUSE
    value: COMPUTE_WH

  # The database dbt *writes*. It reads its sources from STEAM_RAW, which
  # steam-analytics' sources yml names itself (SNOWFLAKE_RAW_DATABASE /
  # SNOWFLAKE_SOURCE_SCHEMA) because every environment reads the same one.
  - name: SNOWFLAKE_DATABASE
    value: STEAM_STAGING

  # dags/steam_dbt_dag.py defaults this to prod, which is exactly what a
  # second environment would silently inherit -- so it is set explicitly here.
  # Worth knowing when reading a failure: the inherited default would *not*
  # look broken from Snowflake's side. profiles.yml's prod target reads the
  # same SNOWFLAKE_DATABASE/ROLE env vars, so staging would still write bare
  # layer schemas into STEAM_STAGING as TRANSFORMER_STAGING. The visible
  # symptom is only in the logs (`dbt --target prod`), which is why this is
  # declared rather than relied on.
  - name: DBT_TARGET
    value: staging

  - name: PIPELINE_ALERT_EMAIL
    valueFrom:
      secretKeyRef:
        name: airflow-alert-email
        key: email

  # The staging Airflow service user's key, generated by terraform/snowflake
  # and rotated on every bring-up. dbt's staging target reads it as content rather
  # than a path, and dbt-snowflake only accepts PKCS#8 PEM with its header
  # and newlines intact — so this namespace's snowflake-keypair holds that
  # full form, under a key named for it. The `kafka` namespace has a secret of
  # the same name whose `private_key` holds the *loader's* key header-stripped
  # on one line, which is what the Kafka sink wants instead; the distinct key
  # names mean a reference pointed at the wrong one fails to resolve rather
  # than quietly handing dbt an encoding it cannot parse. Both are built in
  # bringup/stages/05-cluster.sh.
  - name: SNOWFLAKE_PRIVATE_KEY
    valueFrom:
      secretKeyRef:
        name: snowflake-keypair
        key: private_key_pkcs8

  # Served under /airflow-staging on the shared internal ALB (#107) — tells
  # the API server (Airflow 3's renamed webserver) to generate links/redirects
  # and mount its ASGI app at that prefix instead of assuming /. This is the
  # setting behind "the UI loads but every asset 404s": the ALB rewrites
  # nothing, so without it the server serves /static/... while the browser
  # asks for /airflow-staging/static/.... Kept in extraEnv rather than moved to
  # `config.api.base_url` (which would merge) because it is
  # environment-specific either way, so moving it buys nothing and the env
  # form is what is proven to work behind this ALB.
  - name: AIRFLOW__API__BASE_URL
    value: "/airflow-staging"

# Prod's `/airflow` is a *prefix* of this path, and both rules are
# `pathType: Prefix` on the same ALB -- so prod's rule matches every
# /airflow-staging request too, and whichever is evaluated first wins.
# group.order is a per-rule annotation (not one of the exclusive group-wide
# ones) and **lower is evaluated first**: staging must therefore be below
# prod's 20, or prod swallows staging's traffic entirely and staging has a URL
# that serves prod's Airflow. 10, leaving room on both sides. argocd's
# `/argocd` rule overlaps neither and stays at the default 0.
#
# Everything else about this Ingress -- `scheme`, `target-type`,
# `listen-ports`, `group.name` -- comes from values.yaml precisely because it
# must be *identical* across the group: `scheme` is an exclusive IngressGroup
# annotation, and a member that disagrees on one stops the whole shared ALB
# reconciling for every member, not just itself.
#
# `enabled` lives here too, deliberately paired with `path` -- see values.yaml.
ingress:
  apiServer:
    enabled: true
    path: /airflow-staging
    annotations:
      alb.ingress.kubernetes.io/group.order: "10"
