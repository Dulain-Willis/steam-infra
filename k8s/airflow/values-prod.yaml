# Prod overlay for the Airflow release. Applied on top of values.yaml; see
# that file's header for how the three values files fit together.
#
# Everything here is environment-specific. A staging overlay is the same file
# with SNOWFLAKE_ROLE, SNOWFLAKE_DATABASE, DBT_TARGET, the ingress path and
# group.order changed -- the secret *names* are namespace-local and identical,
# so only their contents differ (bringup/stages/05-cluster.sh creates them).

# The whole block lives in the overlay rather than being split with the base:
# extraEnv is a raw string and Helm replaces strings instead of merging them,
# so a base copy plus an overlay copy would mean the base's is discarded. See
# values.yaml's header.
extraEnv: |
  - name: SNOWFLAKE_ACCOUNT
    valueFrom:
      secretKeyRef:
        name: snowflake-account
        key: account

  - name: SNOWFLAKE_USER
    valueFrom:
      secretKeyRef:
        name: snowflake-user
        key: user

  - name: SNOWFLAKE_ROLE
    value: TRANSFORMER_PROD

  - name: SNOWFLAKE_WAREHOUSE
    value: COMPUTE_WH

  # The database dbt *writes*. It reads its sources from STEAM_RAW, which
  # steam-analytics' sources yml names itself (SNOWFLAKE_RAW_DATABASE /
  # SNOWFLAKE_SOURCE_SCHEMA) because every environment reads the same one.
  - name: SNOWFLAKE_DATABASE
    value: STEAM_PROD

  # dags/steam_dbt_dag.py defaults this to prod, so prod worked without it
  # being set anywhere. Set explicitly now that there is more than one
  # possible answer -- the default is what a second environment would
  # silently inherit.
  - name: DBT_TARGET
    value: prod

  - name: PIPELINE_ALERT_EMAIL
    valueFrom:
      secretKeyRef:
        name: airflow-alert-email
        key: email

  # The prod Airflow service user's key, generated by terraform/snowflake and
  # rotated on every bring-up. dbt's prod target reads it as content rather
  # than a path, and dbt-snowflake only accepts PKCS#8 PEM with its header
  # and newlines intact — so this namespace's snowflake-keypair holds that
  # full form, under a key named for it. The `kafka` namespace has a secret of
  # the same name whose `private_key` holds the *loader's* key header-stripped
  # on one line, which is what the Kafka sink wants instead; the distinct key
  # names mean a reference pointed at the wrong one fails to resolve rather
  # than quietly handing dbt an encoding it cannot parse. Both are built in
  # bringup/stages/05-cluster.sh.
  - name: SNOWFLAKE_PRIVATE_KEY
    valueFrom:
      secretKeyRef:
        name: snowflake-keypair
        key: private_key_pkcs8

  # Served under /airflow on the shared internal ALB (#107) — tells the
  # API server (Airflow 3's renamed webserver) to generate links/redirects
  # with that prefix instead of assuming it's mounted at /. Kept in extraEnv
  # rather than moved to `config.api.base_url` (which would merge) because
  # it is environment-specific either way, so moving it buys nothing and the
  # env form is what is proven to work behind this ALB.
  - name: AIRFLOW__API__BASE_URL
    value: "/airflow"

  # AIRFLOW__API__BASE_URL above mounts the *entire* FastAPI app --
  # including the task execution API -- under the prefix, but the chart's
  # default execution_api_server_url (http://airflow-api-server:8080/execution/)
  # does not know about that prefix. Without this, workers PATCH
  # /execution/task-instances/<id>/run, the api-server only serves that
  # under /airflow/execution/..., and every task fails instantly with
  # ServerResponseError: Not Found (#125). Service name confirmed against
  # `helm template`'s rendered Service, not assumed from the release name.
  - name: AIRFLOW__CORE__EXECUTION_API_SERVER_URL
    value: "http://airflow-api-server:8080/airflow/execution/"

# `/airflow` is a *prefix* of staging's `/airflow-staging`, so the two ALB
# rules overlap and whichever is evaluated first wins. group.order is a
# per-rule annotation (not one of the exclusive group-wide ones), lower is
# evaluated first, and the default is 0 -- so prod takes 20 and staging must
# take something lower, leaving room on either side. argocd's `/argocd` rule
# does not overlap either path and stays at the default.
#
# `enabled` lives here too, deliberately paired with `path` -- see values.yaml.
ingress:
  apiServer:
    enabled: true
    path: /airflow
    annotations:
      alb.ingress.kubernetes.io/group.order: "20"
